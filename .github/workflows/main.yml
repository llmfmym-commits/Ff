name: Build Signed APK from ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TOOLS: "34.0.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout (full history to pick the newest zip)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing secrets exist (values are never printed)
        env:
          S1: ${{ secrets.KEYSTORE_BASE64 }}
          S2: ${{ secrets.KEYSTORE_PASSWORD }}
          S3: ${{ secrets.KEY_ALIAS }}
          S4: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          [ -n "$S1" ] || { echo "::error::Secret KEYSTORE_BASE64 is empty or missing"; missing=1; }
          [ -n "$S2" ] || { echo "::error::Secret KEYSTORE_PASSWORD is empty or missing"; missing=1; }
          [ -n "$S3" ] || { echo "::error::Secret KEY_ALIAS is empty or missing"; missing=1; }
          [ -n "$S4" ] || { echo "::error::Secret KEY_PASSWORD is empty or missing"; missing=1; }
          exit $missing

      - name: Unzip project (newest committed .zip in repo root)
        run: |
          set -e
          echo "Zip files in repo root:"
          BEST=""; BEST_T=0
          while IFS= read -r -d '' f; do
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            [ -n "$t" ] || t=0
            echo "  $f  (commit time $t)"
            if [ "$t" -ge "$BEST_T" ]; then BEST="$f"; BEST_T="$t"; fi
          done < <(find . -maxdepth 1 -type f -name "*.zip" -print0)
          test -n "$BEST" || { echo "::error::No .zip file found in repository root"; ls -la; exit 1; }
          echo "Using zip: $BEST"
          rm -rf extracted && mkdir extracted
          unzip -q "$BEST" -d extracted
          SETTINGS=$(find extracted -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          test -n "$SETTINGS" || { echo "::error::settings.gradle(.kts) not found inside zip"; find extracted -maxdepth 3; exit 1; }
          DIR=$(cd "$(dirname "$SETTINGS")" && pwd)
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project directory: $DIR"
          test -f "$DIR/app/build.gradle.kts" -o -f "$DIR/app/build.gradle" || { echo "::error::app module not found"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(command -v sdkmanager || true)
          if [ -z "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -path "*bin*" | head -n 1)
          fi
          test -n "$SDKM" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;${BUILD_TOOLS}"
          ls "$ANDROID_HOME/build-tools"

      - name: Set up Gradle 8.7 (pinned, compatible with AGP 8.5.2)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK (unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle --version
          gradle assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show the real error if the build failed
        if: failure()
        run: |
          echo "### Gradle error summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          { grep -n -B2 -A14 "What went wrong" "$RUNNER_TEMP/build.log" || grep -n "^e: \|error:" "$RUNNER_TEMP/build.log" | head -40; } | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests (do not block the APK)
        id: unit
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Restore keystore and verify it (nothing is printed)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_V: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks" \
            || { echo "::error::KEYSTORE_BASE64 is not valid Base64"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env KS_PASS -alias "$KEY_ALIAS_V" > /dev/null 2>&1 \
            || { echo "::error::Keystore password or alias is wrong (check KEYSTORE_PASSWORD / KEY_ALIAS)"; exit 1; }
          echo "Keystore OK"

      - name: Align and sign APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_V: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          IN=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$IN" || { echo "::error::No release APK found"; find app/build/outputs -type f; exit 1; }
          echo "Input APK: $IN"
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS_V" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$GITHUB_WORKSPACE/out/SchoolLeague-release-signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "$GITHUB_WORKSPACE/out/SchoolLeague-release-signed.apk" | head -8

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolLeague-release-signed
          path: out/SchoolLeague-release-signed.apk
          if-no-files-found: error

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-logs
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/tests
            ${{ env.PROJECT_DIR }}/app/build/test-results
          if-no-files-found: ignore

      - name: Mark run red if unit tests failed
        if: steps.unit.outcome == 'failure'
        run: |
          echo "::error::APK was built and uploaded, but unit tests FAILED. Download 'test-reports-and-logs' to see which."
          exit 1
