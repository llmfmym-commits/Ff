name: Build Signed APK from ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_TOOLS: "34.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "هیچ فایل zip در ریشه مخزن پیدا نشد"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p extracted
          unzip -q -o "$ZIP" -d extracted
          SETTINGS=$(find extracted -maxdepth 3 -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts داخل zip پیدا نشد"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools and platform
        run: sdkmanager "build-tools;${BUILD_TOOLS}" "platforms;android-34"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS_V=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASS=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets not set. Using a temporary self-signed key (changes every build)."
            TMP_PASS="temp-$(date +%s)"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
              -alias tempkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$TMP_PASS" -keypass "$TMP_PASS" \
              -dname "CN=SchoolLeague, O=Temp, C=IR"
            echo "KS_PASS=$TMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS_V=tempkey" >> "$GITHUB_ENV"
            echo "KEY_PASS=$TMP_PASS" >> "$GITHUB_ENV"
          fi

      - name: Align and sign APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          IN=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
          if [ -z "$IN" ]; then echo "APK بدون امضا پیدا نشد"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          KS_PASS="$KS_PASS" KEY_PASS="$KEY_PASS" "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS_V" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "$GITHUB_WORKSPACE/out/SchoolLeague-release-signed.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "$GITHUB_WORKSPACE/out/SchoolLeague-release-signed.apk"

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolLeague-signed-apk
          path: out/SchoolLeague-release-signed.apk
          if-no-files-found: error
